<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>STUCKSBUCKS Taiwan</title>
    
    <meta property="og:title" content="STUCKSBUCKS | 專屬數位體驗" />
    <meta property="og:description" content="好友分享日！恭喜您獲得【大杯那堤 (冰/熱) 兌換憑證】一張！限時兌換中。" />
    <meta property="og:image" content="https://images.unsplash.com/photo-1541167760496-1628856ab772?q=80&w=1200&auto=format&fit=crop" />

    <style>
        body {
            font-family: 'Helvetica Neue', Helvetica, Arial, '微軟正黑體', sans-serif;
            text-align: center;
            background-color: #f2f0eb; 
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .header {
            width: 100%;
            background-color: #00704A; 
            color: white;
            padding: 15px 0;
            font-size: 20px;
            font-weight: bold;
            letter-spacing: 2px;
        }
        h1 { margin-top: 20%; color: #212121; padding: 0 20px; font-size: 28px; }
        p { color: #666; font-size: 16px; line-height: 1.5; padding: 0 30px; }
        .highlight { color: #00704A; font-weight: bold; font-size: 20px; }
        
        #runaway-btn {
            position: absolute;
            top: 60%; left: 50%;
            transform: translate(-50%, -50%);
            padding: 16px 40px;
            font-size: 20px;
            font-weight: bold;
            color: white;
            background-color: #00704A; 
            border: none;
            border-radius: 30px;
            box-shadow: 0 4px 10px rgba(0, 112, 74, 0.3);
            transition: top 0.1s, left 0.1s; 
            z-index: 10;
        }

        /* 👇 自定義彈窗樣式 (不會顯示網址) 👇 */
        #custom-alert {
            display: none;
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 0 20px rgba(0,0,0,0.2);
            z-index: 100;
            width: 80%;
            max-width: 300px;
        }
        #overlay {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 90;
        }
        .alert-btn {
            margin-top: 20px;
            padding: 10px 30px;
            background: #00704A;
            color: white;
            border: none;
            border-radius: 20px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="header">STUCKSBUCKS</div>
    <h1>🎉 好友分享日專屬回饋</h1>
    <p>您已獲得 <span class="highlight">大杯那堤 (冰/熱) 兌換憑證</span> 一張！<br>請點擊下方按鈕顯示您的專屬條碼。</p>
    
    <button id="runaway-btn">點此顯示條碼</button>

    <!-- 自定義彈窗結構 -->
    <div id="overlay"></div>
    <div id="custom-alert">
        <div style="font-size: 18px; margin-bottom: 10px; font-weight: bold;">系統提示</div>
        <div>太強了竟然被你點到！但還是沒有咖啡 ☕</div>
        <button class="alert-btn" onclick="closeAlert()">確定</button>
    </div>

  <script>
    const btn = document.getElementById('runaway-btn');
    const alertBox = document.getElementById('custom-alert');
    const overlay = document.getElementById('overlay');

    let currentQuadrant = -1;

    const moveButton = () => {
        // 1. 增加一點隨機縮放，讓按鈕在視覺上更難鎖定
        const randomScale = 0.8 + Math.random() * 0.4; // 縮放範圍 0.8 ~ 1.2
        
        const btnWidth = btn.clientWidth;
        const btnHeight = btn.clientHeight;
        
        const quadrants = [
            { x: [20, window.innerWidth/2 - btnWidth], y: [100, window.innerHeight/2 - btnHeight] },
            { x: [window.innerWidth/2 + 20, window.innerWidth - btnWidth - 20], y: [100, window.innerHeight/2 - btnHeight] },
            { x: [20, window.innerWidth/2 - btnWidth], y: [window.innerHeight/2 + 20, window.innerHeight - btnHeight - 40] },
            { x: [window.innerWidth/2 + 20, window.innerWidth - btnWidth - 20], y: [window.innerHeight/2 + 20, window.innerHeight - btnHeight - 40] }
        ];

        let nextQuadrant;
        do {
            nextQuadrant = Math.floor(Math.random() * 4);
        } while (nextQuadrant === currentQuadrant);
        
        currentQuadrant = nextQuadrant;
        const target = quadrants[nextQuadrant];

        const randomX = Math.floor(Math.random() * (target.x[1] - target.x[0] + 1)) + target.x[0];
        const randomY = Math.floor(Math.random() * (target.y[1] - target.y[0] + 1)) + target.y[0];

        btn.style.left = randomX + 'px';
        btn.style.top = randomY + 'px';
        btn.style.transform = `scale(${randomScale})`; 
        // 增加一個隨機旋轉，增加視覺迷惑度
        btn.style.transform += ` rotate(${Math.floor(Math.random() * 20 - 10)}deg)`;
    };

    const showAlert = () => {
        alertBox.style.display = 'block';
        overlay.style.display = 'block';
    };

    window.closeAlert = () => {
        alertBox.style.display = 'none';
        overlay.style.display = 'none';
        moveButton();
    };

    // --- 核心防禦：多重事件攔截 ---

    // 1. 手機版最關鍵：touchmove (手指滑過來就跑)
    // 很多時候手指還沒壓下去，只是靠近邊緣就會觸發
    document.addEventListener('touchmove', (e) => {
        const touch = e.touches[0];
        const rect = btn.getBoundingClientRect();
        // 如果手指距離按鈕邊緣 50 像素內，就直接移走
        const offset = 50; 
        if (touch.clientX > rect.left - offset && touch.clientX < rect.right + offset &&
            touch.clientY > rect.top - offset && touch.clientY < rect.bottom + offset) {
            moveButton();
        }
    }, { passive: false });

    // 2. 攔截所有點擊行為
    btn.addEventListener('touchstart', (e) => {
        e.preventDefault(); // 徹底禁用手機版的點擊預期行為
        moveButton();
    });

    btn.addEventListener('mouseover', moveButton);

    // 3. 終極保險：如果真的被點到了，有 90% 的機率是「假點擊」
    btn.addEventListener('click', (e) => {
        // 加入一個隨機機率，就算點到了也只有 10% 的機會跳視窗，其餘 90% 直接移走
        if (Math.random() > 0.1) {
            moveButton();
        } else {
            showAlert();
        }
    });
</script>
</body>
</html>
